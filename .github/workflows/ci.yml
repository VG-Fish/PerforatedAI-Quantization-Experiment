name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags after v7, so this is
      # pinned to an exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      # Type check, tests (including the model x condition smoke matrix, the
      # artifact-validity property tests, and the seed-paired statistics), and
      # the generated-documentation check.
      - name: Run checks
        run: ./scripts/ci.sh
